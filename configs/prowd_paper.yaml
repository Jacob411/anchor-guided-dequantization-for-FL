experiment:
  name: "prowd_paper_replication"
  seed: 42

federation:
  num_clients: 10
  num_rounds: 200
  fraction_fit: 1.0          # full participation (paper: all 10 clients each round)
  anchor_fraction: 0.5       # 5 Float32 anchors, 5 Int8 constrained (Table 4, 50/50)

client:
  local_epochs: 2            # approximates 200 local steps (~5000 samples/client, batch=50)
  local_lr: 0.01             # paper uses 0.1 but needs careful init; 0.01 avoids NaN divergence
  local_momentum: 0.9
  local_batch_size: 50
  quantization_bits: [8]     # Table 4 main result: Int8 constrained clients

server:
  correction_lr: 0.01        # paper: dequantizer trained with SGD lr=0.01
  correction_epochs: 5       # paper: 5 epochs per round
  correction_hidden_dim: 256
  validation_size: 500

data:
  dataset: "cifar10"
  data_dir: "./data/raw"
  alpha: 100                 # near-IID; paper main experiments do not use Dirichlet

model:
  arch: "cnn"

loss:
  reconstruction_weight: 1.0
  distillation_weight: 1.0   # paper: lambda=1 (equal weighting)
  distillation_temperature: 4.0

metrics:
  output_dir: "./results"
  log_every_n_rounds: 1
