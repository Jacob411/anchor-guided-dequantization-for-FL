experiment:
  name: "extreme_stretch_fl"
  seed: 42

federation:
  num_clients: 10
  num_rounds: 10
  fraction_fit: 1.0          # fraction of clients sampled per round
  anchor_fraction: 0.5       # 50% anchors (5 anchors, 5 constrained) to ensure we have a rich target set

client:
  local_epochs: 2
  local_lr: 0.01
  local_batch_size: 32
  quantization_bits: [2]     # Harsh INT2 constraint to force reliance on CorrectionNet

server:
  correction_lr: 0.001
  correction_epochs: 20
  correction_hidden_dim: 64 # Reduce to avoid OOM issues in training
  validation_size: 500

data:
  dataset: "cifar10"
  data_dir: "./data/raw"
  alpha: 0.1                 # Extreme Dirichlet non-IID concentration to force divergence

model:
  arch: "cnn"

loss:
  reconstruction_weight: 1.0
  distillation_weight: 0.5
  distillation_temperature: 4.0

metrics:
  output_dir: "./results"
  log_every_n_rounds: 1
