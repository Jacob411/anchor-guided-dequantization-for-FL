experiment:
  name: "fedshift_paper_replication"
  seed: 42

federation:
  num_clients: 20
  num_rounds: 800
  fraction_fit: 0.1          # 10 clients per round (matches paper C=0.1)
  anchor_fraction: 0.5       # 50% full-precision (superior group)

client:
  local_epochs: 10
  local_lr: 0.005
  local_batch_size: 50
  local_momentum: 0.9
  quantization_bits: [4]     # change to [4], [6], [7], or [8] for full sweep

server:
  correction_lr: 0.001
  correction_epochs: 20
  correction_hidden_dim: 256
  validation_size: 500

data:
  dataset: "cifar10"
  data_dir: "./data/raw"
  alpha: 0.5                 # Table II row: Dirichlet alpha=0.5

model:
  arch: "cnn"

loss:
  reconstruction_weight: 1.0
  distillation_weight: 0.5
  distillation_temperature: 4.0

metrics:
  output_dir: "./results"
  log_every_n_rounds: 1
