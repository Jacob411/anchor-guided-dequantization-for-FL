experiment:
  name: "anchor_quant_fl"
  seed: 42

federation:
  num_clients: 10
  num_rounds: 50
  fraction_fit: 1.0          # fraction of clients sampled per round
  anchor_fraction: 0.2       # fraction of clients that are anchors (full-precision)

client:
  local_epochs: 2
  local_lr: 0.01
  local_batch_size: 32
  # Bit-widths assigned to constrained clients (sampled uniformly)
  quantization_bits: [2, 4, 8, 16]

server:
  correction_lr: 0.001
  correction_epochs: 5       # inner steps to train CorrectionNet per round
  correction_hidden_dim: 256
  validation_size: 500       # server-side val set for distillation loss

data:
  dataset: "cifar10"
  data_dir: "./data/raw"
  alpha: 0.5                 # Dirichlet non-IID concentration (lower = more non-IID)

model:
  arch: "cnn"                # cnn | resnet18

loss:
  reconstruction_weight: 1.0
  distillation_weight: 0.5
  distillation_temperature: 4.0

metrics:
  output_dir: "./results"
  log_every_n_rounds: 1
