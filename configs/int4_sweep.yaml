experiment:
  name: "int4_sweep"
  seed: 42

federation:
  num_clients: 10
  num_rounds: 20
  fraction_fit: 1.0
  anchor_fraction: 0.2

client:
  local_epochs: 2
  local_lr: 0.01
  local_momentum: 0.9
  local_batch_size: 32
  quantization_bits: [4]

server:
  correction_lr: 0.001
  correction_epochs: 20
  correction_hidden_dim: 256
  validation_size: 500

data:
  dataset: "cifar10"
  data_dir: "./data/raw"
  alpha: 100

model:
  arch: "cnn"

loss:
  reconstruction_weight: 1.0
  distillation_weight: 0.5
  distillation_temperature: 4.0

metrics:
  output_dir: "./results"
  log_every_n_rounds: 1
